name: Clips machen

on:
  schedule:
    - cron: "17 11 * * *"   # jeden Tag 12:17 Uhr Winterzeit (13:17 Sommerzeit)
  workflow_dispatch:         # von Hand starten: Actions -> Clips machen -> Run workflow

permissions:
  contents: write

concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Programme installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -U -r requirements.txt

      - name: Clips machen und hochladen
        run: python auto.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add -f clips/*.json arbeit/erledigte_videos.json arbeit/stand.json arbeit/automatik_log.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Clips vom $(date +%d.%m.%Y)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
